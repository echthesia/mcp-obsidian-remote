name: build-push

# Build the MCP server image and push it to GHCR on every push to main. noema's
# Quadlet unit tracks ghcr.io/echthesia/mcp-obsidian-remote:latest (a moving
# tag) with AutoUpdate=registry, so a push here → new :latest digest → the
# host's podman-auto-update.timer rolls it out (with healthcheck-gated rollback).
# :latest = head of main, continuously deployed (no promotion gate); :sha pins
# each build for provenance/rollback.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/echthesia/mcp-obsidian-remote
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          # Pin the cosign BINARY, not just the action. The action major was
          # doing this job by accident: @v3 defaults to cosign v2.6.1, @v4
          # defaults to v3.0.6. cosign v3 stores signatures as OCI 1.1
          # referrer-attached bundles, and c/image — what podman uses to enforce
          # policy.json on noema — only reads the legacy `sha256-<digest>.sig`
          # tag. A v3-signed image is green in CI, passes `cosign verify`, and
          # is unverifiable at pull time: noema fails closed with "A signature
          # was required, but no signature exists" and silently keeps running
          # the old container. Not fixable by flag — cosign v3.1 removed
          # --new-bundle-format and c/image has no referrers support.
          cosign-release: v2.6.1

      # Sign the pushed digest (covers every tag pointing at it) with the shared
      # echthesia signing key. noema's policy.json (echthesia/infra) rejects
      # unsigned ghcr.io/echthesia/* pulls, so a build that skipped this step
      # would never deploy — fail loudly here instead.
      - name: Sign the pushed digest
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: cosign sign --yes --recursive --key env://COSIGN_PRIVATE_KEY "ghcr.io/echthesia/mcp-obsidian-remote@${{ steps.build.outputs.digest }}"
